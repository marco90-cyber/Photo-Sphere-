name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        run: |
          set +e
          gradle assembleRelease --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E '^e: ' build.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -12 | while IFS= read -r l; do echo "::error::${l}"; done
            grep -E 'What went wrong' -A 4 build.log | head -8 | while IFS= read -r l; do echo "::error::${l}"; done
          fi
          exit $code

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PhotoSphere.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSphere-apk
          path: PhotoSphere.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" PhotoSphere.apk \
            --title "Photo Sphere build ${{ github.run_number }}" \
            --notes "APK generato automaticamente dal commit ${{ github.sha }}" \
            --latest
