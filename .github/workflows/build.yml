name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Prepara la firma privata
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          K_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/app.jks"
            KS_PASS=$(printf %s "$KS_PASS" | tr -d '[:space:]')
            K_PASS=$(printf %s "${K_PASS:-$KS_PASS}" | tr -d '[:space:]')
            # l'alias viene letto dal file: niente errori se il segreto KEY_ALIAS è scritto male
            ALIAS=$(keytool -list -keystore "$RUNNER_TEMP/app.jks" -storepass "$KS_PASS" 2>/dev/null | grep -m1 PrivateKeyEntry | cut -d, -f1)
            echo "::add-mask::$KS_PASS"
            echo "::add-mask::$K_PASS"
            {
              echo "APP_KEYSTORE=$RUNNER_TEMP/app.jks"
              echo "KEYSTORE_PASSWORD=$KS_PASS"
              echo "KEY_PASSWORD=$K_PASS"
              echo "KEY_ALIAS=$ALIAS"
            } >> "$GITHUB_ENV"
            echo "Firma: chiave privata (alias: $ALIAS)"
          else
            echo "::warning::Segreto KEYSTORE_BASE64 assente: APK firmato con la chiave di debug (gli aggiornamenti in app non si potranno installare sopra)"
          fi

      - name: Build release APK
        run: |
          set +e
          gradle assembleRelease --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E '^e: ' build.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -12 | while IFS= read -r l; do echo "::error::${l}"; done
            grep -E 'What went wrong' -A 4 build.log | head -8 | while IFS= read -r l; do echo "::error::${l}"; done
          fi
          exit $code

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PhotoSphere.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSphere-apk
          path: PhotoSphere.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" PhotoSphere.apk \
            --title "Photo Sphere build ${{ github.run_number }}" \
            --notes "APK generato automaticamente dal commit ${{ github.sha }}" \
            --latest
